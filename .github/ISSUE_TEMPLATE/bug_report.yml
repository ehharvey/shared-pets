name: Bug report
description: Something built isn't working as intended
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the component involved (feature, model, sync, widget, etc.) and the device / iOS version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, iOS version, Xcode version, iCloud account state, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      render: shell
    validations:
      required: false
